<!DOCTYPE html>
<html>
<body>

<h1>Power Digit Sum</h1>
<h2>NOT SOLVED</h2>
<p>2Power15 and the sum of its digits is 3 + 2 + 7 + 6 + 8 = 26</p>
<p>What is the sum of the digits of the number 2Power1000?</p>

<h3 id="answer"></h3><!-- This is where the result will be shown -->

<script>


function powerDigitSum(numPower){
    let num = BigInt(numPower[0])
    let power = BigInt(numPower[1])
    // let total = Math.pow(num, power)
    // Had to remove the math.pow() because it cannot handle BigInts
    let total = num ** power
    let digits = total.toString()
    console.log(total)
    let sum = 0
    
    for(i=0;i<digits.length;i++){
        sum += Number(digits[i])
    }

    return sum
}

// log to console
console.log(powerDigitSum([2,1000]));

// Set the result of problem() to the <p> element
document.getElementById("answer").innerHTML = powerDigitSum([2,1000]);


</script>

</body>
</html>
